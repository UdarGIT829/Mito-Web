name: Deploy Mito Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Godot_MitoWeb/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "https://github.com/godotengine/godot/releases/download/4.7.1-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Public data guard
        run: python3 Godot_MitoWeb/tools/check_public.py

      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o godot.zip "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot
          curl -fsSL -o templates.tpz "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dest"
          rm godot.zip templates.tpz

      - name: Import project
        run: ~/godot --headless --path Godot_MitoWeb --import

      - name: Run tests
        timeout-minutes: 10
        run: ~/godot --headless --path Godot_MitoWeb --script res://tests/run_tests.gd

      # The project page (site/) is the site root; the app lives under demo/.
      - name: Export web build
        run: |
          mkdir -p build/web/demo
          ~/godot --headless --path Godot_MitoWeb --export-release "Web" ../build/web/demo/index.html
          test -f build/web/demo/index.wasm

      - name: Add the project page
        run: |
          cp site/index.html build/web/
          cp -r site/screenshots site/assets build/web/
          cp LICENSE build/web/
          test -f build/web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
